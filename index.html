 <div class="plan pr"><h3>Premium<span class="pill">Oylik</span></h3><div style="font:700 22px 'Cormorant Garamond',serif;margin:8px 0;color:var(--acc)">Narx tez orada e'lon qilinadi</div><ul><li>Barcha Premium hikoyalar va videolar</li><li>Yangi kontent birinchi bo'lib</li><li>Qo'shimcha imkoniyatlar (rejada)</li></ul><button class="btn" style="width:100%;margin-top:16px" data-a="soon" data-m="To'lov tizimi hali ulanmagan">Premium'ga o'tish</button></div>
 <p class="note">Namuna: narx va to'lov keyinroq ulanadi. Hozircha hech qanday to'lov amalga oshirilmaydi.</p></div>`}
function render(){
 const v=st.tab==="home"?home():st.tab==="catalog"?catalog():st.tab==="favs"?favs():profile();
 const mini=st.cur!==null?`<div class="mini"><button style="display:contents" data-a="full">${cv(st.cur)}<div class="m"><p>${S[st.cur].t}</p><span class="sub">${S[st.cur].n}</span></div></button><button class="hb" data-a="toggle" aria-label="Boshlash yoki to'xtatish" style="color:var(--txt)">${ic(st.play?"pause":"play")}</button><div class="bar" id="mb" style="width:${(st.prog[st.cur]||0)/S[st.cur].d*100}%"></div></div>`:"";
 const nv=[["home","Bosh sahifa","home"],["catalog","Katalog","grid"],["favs","Saqlanganlar","heart"],["profile","Profil","user"]].map(([t,l,i])=>`<button class="${st.tab===t?"on":""}" data-a="tab" data-t="${t}">${ic(i)}${l}</button>`).join("");
 $("#app").innerHTML=`<div class="scroll" id="sc">${v}</div>${mini}<nav class="nav">${nv}</nav>${st.det!==null?detail(st.det):""}${st.sub?subscr():""}${st.full?player():""}`;
 const tg=window.Telegram&&Telegram.WebApp;if(tg){try{(st.det!==null||st.full||st.sub)?tg.BackButton.show():tg.BackButton.hide()}catch(e){}}
 const q=$("#q");if(q)q.oninput=e=>{st.q=e.target.value;$("#list").innerHTML=list();$("#clr").style.display=st.q?"grid":"none"};
 [$("#sk"),$("#sk2")].forEach(x=>{if(x)x.oninput=e=>{st.prog[st.cur]=+e.target.value;upd()}});
}
function upd(){
 if(st.cur===null)return;const p=st.prog[st.cur]||0,d=S[st.cur].d;
 const t=$("#t1"),sk=$("#sk"),s2=$("#sk2"),mb=$("#mb");if(t)t.textContent=fm(p);if(sk)sk.value=p;if(s2)s2.value=p;if(mb)mb.style.width=p/d*100+"%";
}
let tk=null,sc=0;
function tick(){
 if(!st.play)return;const d=S[st.cur].d;
 st.prog[st.cur]=Math.min(d,(st.prog[st.cur]||0)+.25*st.speed);upd();
 if(++sc%8===0)sv("tg_prog",st.prog);
 if(st.prog[st.cur]>=d){setPlay(false);st.prog[st.cur]=0;sv("tg_prog",st.prog);toast("Hikoya tugadi");render()}
 if(st.sleepAt&&Date.now()>=st.sleepAt){st.sleep=0;st.sleepAt=0;setPlay(false);toast("Uyqu taymeri to'xtatdi");render()}
}
function setPlay(v){st.play=v;clearInterval(tk);if(v)tk=setInterval(tick,250);sv("tg_prog",st.prog)}
function toast(m){const e=document.createElement("div");e.className="toast";e.textContent=m;$("#app").appendChild(e);setTimeout(()=>e.remove(),1800)}
function start(i){if(st.cur!==i){st.cur=i}st.full=true;setPlay(true);render()}
function goBack(){if(st.fs){st.fs=false;fsApply()}else if(st.full){st.full=false}else if(st.sub){st.sub=false}else st.det=null;render()}
document.addEventListener("click",e=>{
 const b=e.target.closest("[data-a]");if(!b)return;const a=b.dataset.a,i=+b.dataset.i;
 if(a==="tab"){st.tab=b.dataset.t;st.det=null;st.sub=false;if(st.tab==="catalog"&&st.load){setTimeout(()=>{st.load=false;if(st.tab==="catalog"&&$("#list"))$("#list").innerHTML=list()},600)}render()}
 else if(a==="cat"){st.cat=b.dataset.c;if(st.tab!=="catalog"){st.tab="catalog";st.load=false}render()}
 else if(a==="sort"){st.sort=b.dataset.k;render()}
 else if(a==="ty"){st.ty=b.dataset.k;render()}
 else if(a==="subs"){st.sub=true;render()}
 else if(a==="subx"){st.sub=false;render()}
 else if(a==="soon")toast(b.dataset.m);
 else if(a==="fs"){st.fs=!st.fs;fsApply();render()}
 else if(a==="theme"){st.th=isDark()?"light":"dark";sv("tg_th",st.th);applyTheme();render()}
 else if(a==="th2"){st.th=b.dataset.k;sv("tg_th",st.th);applyTheme();render()}
 else if(a==="lang"){st.lang=b.dataset.k;sv("tg_lang",st.lang);document.documentElement.lang=st.lang;render()}
 else if(a==="clr2"){setPlay(false);st.fav=[];st.prog={};st.cur=null;sv("tg_fav",[]);sv("tg_prog",{});toast("Tozalandi");render()}
 else if(a==="ao"){st.ao=!st.ao;if(st.fs){st.fs=false;fsApply()}render()}
 else if(a==="clr"){st.q="";render()}
 else if(a==="open"){st.det=i;render()}
 else if(a==="back")goBack();
 else if(a==="fav"){const k=st.fav.indexOf(i);if(k<0){st.fav.push(i);toast("Saqlandi")}else{st.fav.splice(k,1);toast("Olib tashlandi")}sv("tg_fav",st.fav);const o=$(".ov");const y=o?o.scrollTop:0,s2=$("#sc").scrollTop;render();const n=$(".ov");if(n)n.scrollTop=y;$("#sc").scrollTop=s2}
 else if(a==="play")start(i);
 else if(a==="full"){st.full=true;render()}
 else if(a==="min"){st.full=false;if(st.fs){st.fs=false;fsApply()}render()}
 else if(a==="toggle"){setPlay(!st.play);render()}
 else if(a==="skip"){const d=S[st.cur].d;st.prog[st.cur]=Math.max(0,Math.min(d,(st.prog[st.cur]||0)+ +b.dataset.v));upd()}
 else if(a==="speed"){const L=[.75,1,1.25,1.5,2];st.speed=L[(L.indexOf(st.speed)+1)%L.length];b.querySelector("span").textContent=st.speed+"x"}
 else if(a==="sleep"){const L=[0,10,20,30];st.sleep=L[(L.indexOf(st.sleep)+1)%L.length];st.sleepAt=st.sleep?Date.now()+st.sleep*60000:0;b.querySelector("span").textContent=st.sleep?st.sleep+" daq":"Uyqu taymeri"}
});
try{const tg=window.Telegram&&Telegram.WebApp;if(tg){tg.ready();tg.expand();tg.BackButton.onClick(goBack)}}catch(e){}
applyTheme();document.documentElement.lang=st.lang;try{Telegram.WebApp.onEvent("themeChanged",()=>{if(st.th==="auto"){applyTheme();render()}})}catch(e){}
setTimeout(()=>{st.load=false},600);
render();
</script></body></html>
